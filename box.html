<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box</title>
    <style>
        main{
            display: flex;
            flex-wrap: wrap;
          
        }
        .box {
            height: 5rem;
            width: 5rem;
            margin: 1rem;
            background-color: aquamarine;
            border: 1px red solid;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .button{
            height: 2rem;
            width: 2rem;
            background-color: blue;
            border-radius: 0.5rem;
        }
    </style>
</head>

<body>
    <main>
        <div class="box"><button class="button">1</button></div>
        <div class="box"><button class="button">2</button></div>
        <div class="box"><button class="button">3</button></div>
        <div class="box"><button class="button">4</button></div>
        <div class="box"><button class="button">5</button></div>
        <div class="box"><button class="button">6</button></div>
        <div class="box"><button class="button">7</button></div>
        <div class="box"><button class="button">8</button></div>
        <div class="box"><button class="button">9</button></div>
        <div class="box"><button class="button">10</button></div>
        <div class="box"><button class="button">11</button></div>
        <div class="box"><button class="button">12</button></div>
        <div class="box"><button class="button">13</button></div>
        <div class="box"><button class="button">14</button></div>
        <div class="box"><button class="button">15</button></div>
    </main>
</body>

</html>
