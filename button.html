<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>
</head>
<body>
<style>
        button{
           height: 16rem;
           width: 12rem;
           border: 2px black dotted;
           margin: 2rem;
           padding: 2rem;
           border-radius: 2rem;
        }
        button:hover{
            height: 16.5rem;
            width: 12.5rem;
            opacity: 60%;
            cursor: pointer;
        }
        button:active{
            opacity:80% ;
        }
        .btn{
            background-color: rgb(0, 0, 0);
        }
        .red{
            background-color: rgb(255, 0, 0);
        }
        .green{
            background-color: green;
        }
        .blue{
            background-color: blue;
        }
        
    </style>
             

    <button class="btn red" id="btn-1">
        Red
    </button>
    
    <button  class="btn green" id="btn-2">
        Green
    </button>
    
    <button  class="btn blue" id="btn-3">
        Blue
    </button>
</body>
</html>
